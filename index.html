<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXIVORA Algeria - Electric Vehicles</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
      #loader {
        position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 99999; transition: opacity 0.5s;
      }
      #loader.hidden { opacity: 0; pointer-events: none; }
      #loader img { height: 80px; margin-bottom: 24px; }
      #loader p { color: #484F58; font-size: 14px; }
      #loader .spinner {
        width: 40px; height: 40px; border: 3px solid #30363D; border-top-color: #01D7D5;
        border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // Auto-hide loader after 6 seconds as last resort
      setTimeout(function() {
        var loader = document.getElementById('loader');
        if (loader) { loader.classList.add('hidden'); setTimeout(function(){loader.remove()}, 500); }
      }, 6000);

      // CRITICAL: Catch ALL JavaScript errors and display them
      window.onerror = function(msg, url, line, col, err) {
        var root = document.getElementById('root');
        var loader = document.getElementById('loader');
        if (loader) loader.style.display = 'none';
        if (root) root.innerHTML = '<div style="padding:20px;font-family:system-ui;background:#000;color:#fff;min-height:100vh;"><h2 style="color:#EF4444;">Error</h2><pre style="color:#8B949E;white-space:pre-wrap;font-size:12px;">' + msg + '<br>Line: ' + line + '</pre><button onclick="window.location.reload()" style="margin-top:20px;padding:10px 20px;background:#01D7D5;color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Refresh</button></div>';
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        var loader = document.getElementById('loader');
        if (loader) loader.style.display = 'none';
        if (root) root.innerHTML = '<div style="padding:20px;font-family:system-ui;background:#000;color:#fff;min-height:100vh;"><h2 style="color:#EF4444;">Promise Error</h2><pre style="color:#8B949E;white-space:pre-wrap;font-size:12px;">' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '</pre><button onclick="window.location.reload()" style="margin-top:20px;padding:10px 20px;background:#01D7D5;color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Refresh</button></div>';
      });
    </script>
  </head>
  <body>
    <div id="loader">
      <img src="/nexivora-logo.png" alt="NEXIVORA" />
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <style>#loader { display: none; }</style>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;text-align:center;padding:20px;">
        <div>
          <h1 style="font-size:24px;margin-bottom:16px;color:#01D7D5;">NEXIVORA</h1>
          <p style="color:#8B949E;">Please enable JavaScript to use this website.</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
